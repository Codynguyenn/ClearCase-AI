name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest + MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.lock
      - name: Download spaCy English NER model
        run: python -m spacy download en_core_web_sm
      # The embedding model (~90 MB, pinned revision) is cached between runs. The key changes whenever
      # backend/app/config.py does, which is where the pinned revision lives.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .local/models
          key: embedding-model-${{ hashFiles('backend/app/config.py') }}
      - name: Download embedding model (pinned revision)
        working-directory: backend
        run: python -m app.cli download-embedding-model
      - name: Generate sample documents
        run: python sample_data/generate_samples.py
      - name: Run tests
        working-directory: backend
        env:
          CLEARCASE_MONGODB_URI: mongodb://127.0.0.1:27017
        run: python -m pytest -q

  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
