[project]
name = "clearcase-backend"
version = "0.1.0"
description = "ClearCase backend: AI-assisted legal document redaction (FastAPI + MongoDB + PyMuPDF)"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
# Direct dependencies are pinned exactly. `requirements.lock` is the full
# transitive freeze produced from a clean virtualenv (see README "Dependencies").
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.15.0",
    "pymongo==4.18.3",
    "pymupdf==1.28.2",
    "python-multipart==0.0.32",
    "spacy==3.8.16",
    "mcp==2.3.0",
    "jsonschema==4.26.0",
    "sentence-transformers==6.1.0",
    "torch==2.14.1",
    "numpy==2.5.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "ruff==0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes (unused names), I import order, B bugbear (likely bugs), UP modern Python.
select = ["E", "F", "W", "I", "B", "UP"]
# E501 (line length) is ignored on purpose: there is no auto-formatter here, a long line is not a defect, and
# forcing wraps on prose-heavy lines (tests, messages) makes them harder to read.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
